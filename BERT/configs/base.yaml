# ===========================================================
# BERT Configuration — Adapted for Apple M1 (16GB)
# Based on "BERT: Pre-training of Deep Bidirectional Transformers
# for Language Understanding" (Devlin et al., 2019)
# ===========================================================
#
# HARDWARE DEVIATION FROM PAPER:
#   Paper:  16 Cloud TPUs (64 TPU chips) for 4 days, Appendix A.2
#   Ours:   1× Apple M1 (7-core GPU, 16GB unified memory)
#
# MODEL DEVIATION FROM PAPER (BERT-base, Section 3.1 / A.3):
#   Paper BERT-base:  L=12, H=768, A=12, intermediate=3072 → 110M params
#   Ours:             L=6,  H=256, A=8,  intermediate=1024
#   We shrink depth/width to fit 16GB unified memory. The full 12-layer,
#   768-wide model + optimizer states + activations would exceed memory.
#
# DATA DEVIATION FROM PAPER:
#   Paper:  BooksCorpus (800M words) + English Wikipedia (2,500M words)
#   Ours:   Bengali Wikipedia (wikimedia/wikipedia, config 20231101.bn)
#   NSP needs document structure, so we keep whole articles (one article =
#   one document) rather than a shuffled sentence dump.
#
# Everything else (objectives, 80/10/10 masking, AdamW, warmup→linear
# decay) follows the paper.
# ===========================================================

# --- Model Architecture (Section 3.1, Appendix A.3) ---
model:
  d_model: 256          # Paper (H): 768 (reduced for M1 memory)
  num_heads: 8          # Paper (A): 12 — 256/8 = 32 per head
  d_ff: 1024            # Paper (intermediate): 3072 = 4·H (kept 4·d_model)
  num_layers: 6        # Paper (L): 12 (reduced for M1 memory + speed)
  dropout: 0.1          # Paper: 0.1 on all layers, Section A.2 (same ✓)
  max_position_embeddings: 512   # Paper: 512, Section 3.1 — learned position table size
  num_segments: 2       # Segment embeddings A/B for NSP, Section 3.1

# --- Training (Appendix A.2) ---
training:
  max_seq_len: 128      # Paper: 512 (90% of steps trained at 128, then 512), A.2 — we stay at 128 for M1 memory
  batch_size: 32        # Paper: 256 sequences, A.2 (reduced for M1 memory)
  num_epochs: 10        # Paper: ~40 epochs / 1M steps, A.2 — staged like transformer: first run 10, then resume +20 (~30 total) if val loss still dropping
  mlm_probability: 0.15 # Paper: mask 15% of WordPiece tokens, Section 3.1 (same ✓)
  warmup_steps: 10000   # Paper: 10,000, A.2 (same ✓)
  clip_grad_norm: 1.0   # Max gradient norm — safety net against exploding gradients
  val_split: 0.1        # Fraction reserved for validation (10%)

# --- Optimizer (Appendix A.2 — AdamW, all same as paper ✓) ---
optimizer:
  lr: 1.0e-4            # Paper: 1e-4, A.2
  betas: [0.9, 0.999]  # Paper: β₁=0.9, β₂=0.999, A.2
  eps: 1.0e-6          # Paper: 1e-6, A.2
  weight_decay: 0.01   # Paper: L2 weight decay 0.01, A.2

# --- Data ---
data:
  dataset: "wikimedia/wikipedia"   # HuggingFace dataset
  wiki_dump: "20231101.bn"         # Bengali Wikipedia snapshot
  corpus_path: "BERT/data/bn_wiki.txt"   # prepare_corpus.py writes here; build_documents reads it
  max_articles: 20000              # null = use the full dump
  min_chars: 200                   # skip stubs shorter than this
  vocab_size: 10000                # Paper: 30000 WordPiece, Section 3 — dropped for our smaller corpus so rare-token rows actually train
  num_workers: 0                   # 0 = main process only (safe for macOS/MPS)

# --- Special Tokens (must match SPECIAL_TOKENS order in data_utils.py) ---
tokens:
  pad_idx: 0    # [PAD]  — padding
  unk_idx: 1    # [UNK]  — unknown / out-of-vocab
  cls_idx: 2    # [CLS]  — sequence start; pooled for NSP
  sep_idx: 3    # [SEP]  — segment separator / end
  mask_idx: 4   # [MASK] — masked-token placeholder for MLM

# --- Seed ---
seed: 42

# --- Device ---
device: "auto"  # "auto" → MPS/CUDA if available, else CPU. Options: "auto", "mps", "cpu", "cuda"

# --- Paths ---
paths:
  tokenizer_dir: "BERT/tokenizer/base/"
  checkpoint_dir: "BERT/checkpoints/base/"
  log_dir: "BERT/logs/base/"
